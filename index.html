    --primary: #4CAF50;
    --primary-from: #10A858;
    --primary-to: #30CF7B;
    --secondary: #E91E8C;
    --gold: #C5A83B;
    --ink: #1A1A1A;
    --muted: #6b6b6b;
    --border: #E8E8E8;
    --surface: #FFFFFF;
    --bg: #F5F7F4;
    --sidebar: #10241a;
    --sidebar-soft: #1b3527;
    --cream: #FFF9E6;
    --pink: #FFF0F6;
    --blue: #EAF2FC;
    --green: #EFFBF1;
    --gradient: linear-gradient(135deg, #10A858 0%, #30CF7B 100%);

    --font-b: "Poppins", -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    --shadow: 0 1px 3px rgba(0,0,0,.08);
    --shadow-lg: 0 18px 40px rgba(0,0,0,.14);

  h1,h2,h3,h4 { font-family: var(--font-h); margin: 0; text-wrap: balance; }

  a { color: inherit; }

  /* ===== Sidebar ===== */

  .brand { display: flex; align-items: center; gap: 10px; padding: 6px 10px 16px; }
  .brand-logo { width: 38px; height: 38px; border-radius: 11px; background: var(--gradient); display: grid; place-items: center; font-family: var(--font-h); font-weight: 800; color: #fff; font-size: 19px; }
  .brand-name { font-family: var(--font-h); font-weight: 700; font-size: 15px; line-height: 1.1; color: #fff; }
  .brand-name span { display: block; font-weight: 400; font-size: 11px; color: #86b79c; letter-spacing: .04em; }

  .progress-card { background: var(--sidebar-soft); border-radius: 12px; padding: 12px 14px; margin: 4px 6px 12px; }
  .progress-card .lbl { font-size: 11px; color: #86b79c; text-transform: uppercase; letter-spacing: .06em; display:flex; justify-content:space-between; }
  .bar { height: 8px; border-radius: 99px; background: rgba(255,255,255,.12); margin-top: 8px; overflow: hidden; }
  .bar > i { display: block; height: 100%; width: 0; background: var(--gradient); border-radius: 99px; transition: width .5s var(--ease); }

  .nav-label { font-size: 10px; text-transform: uppercase; letter-spacing: .1em; color: #5f8a71; padding: 12px 12px 4px; }
  .nav-item { display: flex; align-items: center; gap: 11px; padding: 10px 12px; border-radius: 10px; color: #cfe6d8; font-weight: 500; font-size: 14px; border: none; background: none; width: 100%; text-align: left; transition: background .15s; }
  .nav-item:hover { background: rgba(255,255,255,.06); }
  .nav-item.active { background: rgba(48,207,123,.16); color: #fff; }
  .nav-item .ic { width: 22px; text-align: center; font-size: 16px; flex: 0 0 auto; }
  .nav-item .dot { margin-left: auto; width: 8px; height: 8px; border-radius: 99px; background: var(--primary); opacity: 0; }
  .nav-item.done .dot { opacity: 1; }
  .side-foot { margin-top: auto; padding: 10px 12px; font-size: 11px; color: #5f8a71; }

  /* ===== Main ===== */
  .main { min-width: 0; display: flex; flex-direction: column; }
  .topbar { position: sticky; top: 0; z-index: 20; background: rgba(245,247,244,.9); backdrop-filter: blur(8px); border-bottom: 1px solid var(--border); padding: 12px 24px; display: flex; align-items: center; gap: 14px; }
  .topbar .hb { display: none; background: var(--surface); border: 1px solid var(--border); border-radius: 10px; width: 40px; height: 40px; font-size: 18px; }
  .topbar h1 { font-size: 17px; font-weight: 700; }
  .topbar .spacer { margin-left: auto; }
  .pill { background: var(--surface); border: 1px solid var(--border); border-radius: 99px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--muted); display: inline-flex; align-items: center; gap: 7px; }

  .view { padding: 26px 24px 60px; max-width: 1040px; width: 100%; margin: 0 auto; }

  /* ===== Início ===== */
  .welcome { background: var(--gradient); color: #fff; border-radius: var(--radius); padding: 30px; position: relative; overflow: hidden; }
  .welcome::after { content: "📖"; position: absolute; right: 18px; bottom: -14px; font-size: 108px; opacity: .18; }
  .welcome h2 { font-size: clamp(22px,4vw,30px); font-weight: 800; }
  .welcome p { margin: 8px 0 0; max-width: 520px; opacity: .92; }
  .btn { border: none; border-radius: 99px; padding: 13px 26px; font-family: var(--font-h); font-weight: 700; font-size: 15px; transition: transform .2s var(--ease), box-shadow .2s var(--ease), filter .2s; display: inline-flex; align-items: center; gap: 8px; }
  .btn-white { background: #fff; color: #0c7a44; margin-top: 18px; box-shadow: 0 8px 20px rgba(0,0,0,.15); }
  .btn-white:hover { transform: translateY(-2px); }
  .btn-primary { background: var(--gradient); color: #fff; box-shadow: 0 10px 22px rgba(16,168,88,.28); }
  .btn-primary:hover { transform: translateY(-2px); filter: brightness(1.05); }
  .btn-ghost { background: var(--surface); border: 1px solid var(--border); color: var(--ink); }
  .btn-ghost:hover { background: #fafafa; }

  .section-title { font-size: 15px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 30px 0 14px; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap: 16px; }
  .mcard { background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; box-shadow: var(--shadow); text-align: left; transition: transform .2s var(--ease), box-shadow .2s var(--ease); position: relative; }
  .mcard:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  .mcard .thumb { height: 92px; border-radius: 12px; display: grid; place-items: center; font-size: 44px; margin-bottom: 14px; }
  .mcard h4 { font-size: 15px; }
  .mcard .meta { font-size: 12.5px; color: var(--muted); margin-top: 4px; }
  .mcard .chk { position: absolute; top: 14px; right: 14px; width: 24px; height: 24px; border-radius: 99px; background: #eee; color: #fff; display: grid; place-items: center; font-size: 14px; }
  .mcard.done .chk { background: var(--primary); }
  .tag { display: inline-block; font-family: var(--font-h); font-size: 10px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; padding: 3px 9px; border-radius: 99px; }
  .tag-bonus { background: rgba(197,168,59,.15); color: #9a7d16; border: 1px solid rgba(197,168,59,.4); }

  /* ===== Leitor / livro ===== */
  .reader-top { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; flex-wrap: wrap; }
  .reader-top .btn-ghost { padding: 9px 16px; font-size: 14px; }
  .reader-stage { background: #e9ece8; border-radius: var(--radius); padding: 22px; display: flex; flex-direction: column; align-items: center; }
  .book { position: relative; width: 100%; max-width: 560px; aspect-ratio: 3/4; }
  .page-wrap { position: relative; width: 100%; height: 100%; border-radius: 12px; box-shadow: var(--shadow-lg); overflow: hidden; background: #fff; }
  .reader-controls { display: flex; align-items: center; gap: 18px; margin-top: 18px; }
  .rc-btn { width: 46px; height: 46px; border-radius: 99px; border: 1px solid var(--border); background: #fff; font-size: 18px; box-shadow: var(--shadow); transition: transform .15s; }
  .rc-btn:hover:not(:disabled) { transform: scale(1.08); }
  .rc-btn:disabled { opacity: .4; cursor: default; }
  .rc-count { font-family: var(--font-h); font-weight: 600; font-variant-numeric: tabular-nums; color: var(--muted); min-width: 66px; text-align: center; }

  /* ===== Ficha (worksheet) ===== */
  .sheet { width: 100%; height: 100%; padding: 22px; background: #fffdf7; display: flex; flex-direction: column; gap: 14px; font-family: var(--font-b); }
  .sheet-head { display: flex; justify-content: space-between; align-items: center; }
  .sheet-tag { font-family: var(--font-h); font-weight: 800; font-size: 12px; color: #fff; padding: 5px 12px; border-radius: 99px; }
  .sheet-fields { display: flex; gap: 12px; font-size: 10px; color: #9a9a9a; }
  .sheet-fields span { border-bottom: 1.5px dotted #c9c9c9; padding: 0 14px 2px 2px; }
  .sheet-title { font-family: var(--font-h); font-weight: 700; font-size: 17px; text-align: center; color: #333; }
  .sheet-title b { color: var(--primary); }
  .syl-row { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
  .syl { border: 2px solid #e4e4e4; border-radius: 12px; padding: 8px 4px; width: 74px; text-align: center; background: #fff; }
  .syl .solid { font-family: var(--font-h); font-weight: 800; font-size: 22px; }
  .syl .ghost { font-family: var(--font-h); font-weight: 800; font-size: 22px; color: #dededed0; }
  .syl .mark { font-size: 15px; margin-top: 2px; letter-spacing: 2px; }
  .sheet-illus { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; background: #fff; border: 2px dashed #e4e4e4; border-radius: 14px; }
  .sheet-illus .emoji { font-size: 60px; line-height: 1; }
  .sheet-illus .word { font-family: var(--font-h); font-weight: 800; font-size: 30px; letter-spacing: 4px; color: #d7d7d7; -webkit-text-stroke: 1px #bcbcbc; }
  .sheet-illus .phrase { font-family: var(--font-h); font-weight: 800; font-size: 19px; letter-spacing: 1px; color: #cfcfcf; text-align: center; padding: 0 8px; }
  .graf-row { display: flex; justify-content: center; gap: 10px; color: #cbcbcb; font-size: 20px; letter-spacing: 6px; }
  .sheet-foot { text-align: center; font-size: 10px; color: #c4b98a; }

  .letters { display: grid; grid-template-columns: repeat(auto-fill, minmax(64px,1fr)); gap: 12px; margin-top: 8px; }
  .letter { aspect-ratio: 1; border-radius: 14px; border: 1px solid var(--border); background: var(--surface); font-family: var(--font-h); font-weight: 800; font-size: 26px; color: var(--ink); box-shadow: var(--shadow); transition: transform .12s, background .12s; display:grid; place-items:center; }

  .day .dtask { color: var(--muted); font-size: 14px; flex: 1; }
  .day .tick { width: 30px; height: 30px; border-radius: 8px; border: 2px solid var(--border); background: #fff; display: grid; place-items: center; font-size: 16px; color: #fff; flex: 0 0 auto; }
  .day.on .tick { background: var(--primary); border-color: var(--primary); }
  .day.on .dtask { text-decoration: line-through; opacity: .6; }

  .diploma .dsub { color: var(--muted); margin: 10px 0; }
  .diploma .dname { font-family: var(--font-h); font-weight: 800; font-size: 30px; color: var(--primary); border-bottom: 2px dashed #e0d59f; display: inline-block; padding: 0 24px 6px; min-width: 260px; }
  .diploma .dfoot { display: flex; justify-content: space-around; margin-top: 26px; font-size: 12px; color: var(--muted); }
  .diploma .dfoot b { display: block; font-family: var(--font-h); color: var(--ink); border-top: 1px solid #ccc; padding-top: 6px; }

  .field { display: flex; gap: 10px; max-width: 460px; margin: 0 auto; }
  .field input { flex: 1; padding: 13px 16px; font-family: var(--font-b); font-size: 15px; border: 1px solid var(--border); border-radius: 12px; }
  .field input:focus { outline: none; border-color: var(--primary); box-shadow: 0 0 0 3px rgba(76,175,80,.18); }

  .prose { max-width: 640px; }
  .prose p { color: #3a3a3a; line-height: 1.7; }
  .prose h3 { margin: 22px 0 8px; font-size: 17px; }
  .callout { background: var(--cream); border: 1px solid #efe3b8; border-radius: 12px; padding: 16px 18px; font-size: 14px; }

  .intro-line { color: var(--muted); max-width: 640px; margin: 4px 0 20px; }

  /* Toast */
  .toast { position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%) translateY(20px); background: #10241a; color: #fff; padding: 13px 20px; border-radius: 12px; font-size: 14px; font-weight: 500; box-shadow: var(--shadow-lg); opacity: 0; pointer-events: none; transition: all .3s var(--ease); z-index: 60; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .backdrop { display: none; }

  /* ===== Responsivo ===== */
  @media (max-width: 860px) {
    .app { grid-template-columns: 1fr; }
    .side { position: fixed; left: 0; top: 0; z-index: 50; width: 280px; transform: translateX(-100%); transition: transform .28s var(--ease); }
    .side.open { transform: translateX(0); }
    .topbar .hb { display: grid; place-items: center; }
    .backdrop.show { display: block; position: fixed; inset: 0; background: rgba(0,0,0,.4); z-index: 40; }
  }
</style>

function letterSheets(tag,a,variant){ return a.map(([l,w,e])=>({tag, letter:l, word:w, emoji:e, variant})); }
function formarSheets(a){ return a.map(([w,s,e])=>({tag:"FORMAR PALAVRAS", variant:"formar", word:w, syl:s.split("-"), emoji:e})); }
function bookMod(id,nav,title,icon,bg,emoji,color,sheets,back){ return { id, type:"book", nav, title, icon, thumbBg:bg, emoji, color, sheets, total:sheets.length, meta:sheets.length+" atividades", back:back||"inicio" }; }

/* ===================== NAV ===================== */
function buildNav(){
  const nav = $("#nav");
  let h = `<div class="nav-label">Programa</div>`;
  h += navItem("inicio","🏠","Início");
  modules.forEach(m => h += navItem(m.id, m.icon, m.nav, state.done[m.id]));
  h += `<div class="nav-label">Extras premium</div>`;
  bonus.forEach(b => h += navItem(b.id, b.icon, b.nav));
  nav.innerHTML = h;
  nav.querySelectorAll(".nav-item").forEach(el => el.addEventListener("click", () => { go(el.dataset.id); closeSide(); }));
}
function navItem(id, ic, label, done){
  return `<button class="nav-item ${current===id?'active':''} ${done?'done':''}" data-id="${id}">
    <span class="ic">${ic}</span><span>${label}</span><span class="dot"></span></button>`;
}
function updateProgress(){
  const books = modules.filter(m => m.type==="book");
  const total = books.length;
  const d = books.filter(m => state.done[m.id]).length;
  const pct = Math.round(d/total*100);
  $("#progBar").style.width = pct + "%";
  $("#progPct").textContent = pct + "%";
  const days = Object.values(state.plan).filter(Boolean).length;
  $("#streak").textContent = days;
}

/* ===================== ROUTER ===================== */
function go(id){
  current = id;
  buildNav();
  const m = modules.find(x=>x.id===id) || bonus.find(x=>x.id===id) || bonusBooks.find(x=>x.id===id);
  $("#crumb").textContent = id==="inicio" ? "Início" : (m ? m.title : "Início");
  view.scrollTop = 0; window.scrollTo(0,0);
  if (id==="inicio") return renderInicio();
  if (!m) return renderInicio();
  if (m.type==="prose") return renderGuia();
  if (m.type==="book") return renderBook(m);
  if (m.type==="bonuslist") return renderBonusList();
  if (m.type==="sons") return renderSons();
  if (m.type==="plano") return renderPlano();
  if (m.type==="diploma") return renderDiploma();
  if (m.type==="paisguide") return renderPais();
  if (m.type==="apoio") return renderApoio();
}

let book = { mod:null, page:0 };
function renderBook(m){
  book = { mod:m, page:0 };
  const done = state.done[m.id];
  view.innerHTML = `
    <div class="reader-top">
      <button class="btn-ghost btn" onclick="go('${m.back||'inicio'}')">← Voltar</button>
      <div style="flex:1"></div>
      <button class="btn ${done?'btn-ghost':'btn-primary'}" id="doneBtn" onclick="toggleDone('${m.id}')">${done?'✓ Concluído':'Marcar como concluído'}</button>
      <button class="btn-ghost btn" onclick="toast('Na versão final, esta ficha é descarregada em PDF para imprimir 🖨️')">⬇ Descarregar</button>
    </div>
    <div class="reader-stage">
      <div class="book"><div class="page-wrap" id="pageWrap"></div></div>
      <div class="reader-controls">
        <button class="rc-btn" id="prev" aria-label="Anterior">‹</button>
        <span class="rc-count" id="count"></span>
        <button class="rc-btn" id="next" aria-label="Seguinte">›</button>
      </div>
    </div>`;
  $("#prev").onclick = () => flip(-1);
  $("#next").onclick = () => flip(1);
  drawPage();
}
function flip(d){
  const n = book.mod.sheets.length;
  book.page = Math.max(0, Math.min(n-1, book.page + d));
  drawPage();
}
function drawPage(){
  const m = book.mod, i = book.page, s = m.sheets[i];
  $("#pageWrap").innerHTML = sheetHTML(s, m.color);
  $("#count").textContent = `${i+1} / ${m.sheets.length}`;
  $("#prev").disabled = i===0;
  $("#next").disabled = i===m.sheets.length-1;
}
function sheetHTML(s, color){
  let body, title;
  if (s.variant==="formar"){
    title = `Que letra falta na palavra?`;
    const rest = s.word.slice(1);
    body = `<div class="syl-row" style="align-items:center">
        <div class="syl" style="width:60px;border-style:dashed;border-color:${color}"><div class="ghost" style="font-size:34px;color:${color}">?</div></div>
        <div style="font-family:var(--font-h);font-weight:800;font-size:34px;letter-spacing:5px;color:#3a3a3a">${rest}</div>
      </div>
      <div class="sheet-illus"><div class="emoji">${s.emoji}</div><div class="word">${s.word}</div></div>`;
  } else if (s.letter){
    const vt = s.variant;
    title = vt==="puzzle" ? `Monta a letra <b style="color:${color}">${s.letter}</b>`
          : vt==="relogio" ? `A letra <b style="color:${color}">${s.letter}</b> e o relógio`
          : vt==="caras" ? `A letra <b style="color:${color}">${s.letter}</b> sorridente`
          : `Traça a letra <b style="color:${color}">${s.letter}</b>`;
    const boxes = [0,1,2,3].map(k=>`<div class="syl" style="width:66px"><div class="${k===0?'solid':'ghost'}" style="${k===0?`color:${color};`:''}font-size:38px">${s.letter}</div></div>`).join("");
    const deco = vt==="relogio" ? `<div class="graf-row" style="font-size:24px">🕐 🕓 🕗 🕛</div>`
               : vt==="caras" ? `<div class="graf-row" style="font-size:24px">😀 😃 😄 😊</div>`
               : vt==="puzzle" ? `<div class="graf-row" style="font-size:22px">🧩 🧩 🧩 🧩</div>`
               : `<div class="graf-row">▲ ● ■ ◆</div>`;
    body = `<div class="syl-row">${boxes}</div>
      <div class="sheet-illus"><div class="emoji">${s.emoji}</div><div class="word">${s.word}</div></div>
      ${deco}`;
  } else if (s.phrase){
    title = `Lê, ouve e traça a frase`;
    body = `<div class="sheet-illus"><div class="emoji">${s.emoji}</div><div class="phrase">${s.phrase}</div></div>
      <div class="graf-row">▲ ● ■ ▲ ● ■ ▲ ●</div>`;
  } else {
    title = `Lê, ouve e traça a palavra <b style="color:${color}">${s.word}</b>`;
    const marks = ["▲","●","■","◆","▼"];
    const syl = s.syl.map((x,idx)=>`<div class="syl"><div class="solid" style="color:${color}">${x}</div><div class="ghost">${x}</div><div class="mark" style="color:${color}">${marks[idx%marks.length]}</div></div>`).join("");
    body = `<div class="syl-row">${syl}</div>
      <div class="sheet-illus"><div class="emoji">${s.emoji}</div><div class="word">${s.word}</div></div>`;
  }
  return `<div class="sheet">
    <div class="sheet-head"><span class="sheet-tag" style="background:${color}">${s.tag}</span>
      <div class="sheet-fields"><span>Nome:</span><span>Data:</span></div></div>
    <div class="sheet-title">${title}</div>
    ${body}
    <div class="sheet-foot">Grafismo Fonético · Leitura · Som · Grafismos</div>
  </div>`;
}
function toggleDone(id){
  state.done[id] = !state.done[id];
  save(); updateProgress(); buildNav();
  const b = $("#doneBtn");
  if (b){ const d = state.done[id]; b.textContent = d?'✓ Concluído':'Marcar como concluído'; b.className = `btn ${d?'btn-ghost':'btn-primary'}`; if(d) toast("Boa! Módulo concluído ✅"); }
}

/* ---------- Cartões de Sons ---------- */
let ptVoice = null, voiceChecked = false;
function pickPtVoice(){
  const vs = (typeof speechSynthesis !== "undefined") ? (speechSynthesis.getVoices()||[]) : [];
  ptVoice = vs.find(x=>/pt[-_]PT/i.test(x.lang)) || null;
  voiceChecked = true;
  return { hasPtPt: !!ptVoice, anyPt: vs.some(x=>/^pt/i.test(x.lang)) };
}
function renderSons(){
  const info = pickPtVoice();
  const banner = info.hasPtPt
    ? `<div class="callout" style="margin-bottom:16px;background:var(--green);border-color:#cceccf">✅ Voz de <b>português de Portugal</b> detetada neste dispositivo${ptVoice&&ptVoice.name?` (${ptVoice.name})`:''}. Clique numa letra para ouvir.</div>`
    : `<div class="callout" style="margin-bottom:16px">🔊 Este dispositivo ${info.anyPt?'tem voz portuguesa, mas pode ser do Brasil':'não tem voz portuguesa instalada'} — o sotaque pode não ser o de Portugal. Para a pronúncia perfeita, a versão final inclui <b>áudios gravados por locutor português</b>.</div>`;
  view.innerHTML = `<p class="intro-line">Clique em cada letra para ouvir o som e um exemplo em português de Portugal. As <b style="color:var(--secondary)">vogais</b> estão destacadas.</p>
    ${banner}
    <div class="letters">${ALFA.map(([l,w])=>`<button class="letter ${'AEIOU'.includes(l)?'vowel':''}" data-l="${l}" data-w="${w}" title="${l} de ${w.toLowerCase()}">${l}</button>`).join("")}</div>`;
  view.querySelectorAll(".letter").forEach(b => b.addEventListener("click", ()=> speak(b)));
}
function speak(btn){
  const l = btn.dataset.l, w = (btn.dataset.w||"").toLowerCase();
  const text = w ? `${l}, de ${w}` : l;   // a voz pt-PT pronuncia o nome da letra corretamente
  try {
    if (typeof speechSynthesis === "undefined") throw 0;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = "pt-PT"; u.rate = .82; u.pitch = 1.05;
    if (!voiceChecked) pickPtVoice();
    if (ptVoice) u.voice = ptVoice;
    btn.classList.add("speaking");
    u.onend = ()=> btn.classList.remove("speaking");
    setTimeout(()=>btn.classList.remove("speaking"), 1600);
    speechSynthesis.speak(u);
  } catch(e){ toast("O seu navegador não suporta leitura de voz."); }
}

    <p>Evite corrigir em excesso ou comparar com outras crianças. Se houver frustração, pare e retome no dia seguinte. O ritmo é da criança.</p>
    <div class="callout" style="margin-top:18px">👀 <b>Sinais de progresso:</b> reconhecer sons mais depressa, tentar ler palavras novas e pedir para fazer a ficha. São ótimos indicadores!</div>
  </div>`;
}
